org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 示例 app 版本号：每次改动 +1（CI 里可以用环境变量 GOO_VERSION_CODE 覆盖）
EXAMPLE_VERSION_CODE=307

# Maven Central 发布（com.vanniktech.maven.publish 读这些）。版本号发布时由 tag 传入：-PVERSION_NAME=0.2.0
GROUP=io.github.feice11
VERSION_NAME=0.2.0-SNAPSHOT
POM_URL=https://github.com/feice11/mochi-compose
POM_INCEPTION_YEAR=2026
POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/feice11/mochi-compose
POM_SCM_CONNECTION=scm:git:git://github.com/feice11/mochi-compose.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/feice11/mochi-compose.git
POM_DEVELOPER_ID=feice11
POM_DEVELOPER_NAME=feice11
POM_DEVELOPER_URL=https://github.com/feice11
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
