name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Build library
        run: ./gradlew --no-daemon :mochi-compose:assembleRelease :mochi-compose:publishToMavenLocal

      # 签名：仓库 Secrets 里配了 GOO_KEYSTORE_BASE64 等就用你自己的 key；
      # 没配就临时生成一把（每次构建都不同，覆盖安装会提示签名冲突，需要先卸载旧版）
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.GOO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GOO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GOO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GOO_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GOO_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "GOO_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "GOO_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" -keypass "$PASS" \
              -alias mochi -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mochi"
            echo "GOO_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "GOO_KEY_ALIAS=mochi" >> "$GITHUB_ENV"
            echo "GOO_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
          echo "GOO_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "GOO_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build example app
        run: ./gradlew --no-daemon :example:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: mochi-compose-example-release-apk
          path: example/build/outputs/apk/release/*.apk
